# Builds the docs site (tcm's docs pages, from its codebase, and the examples page) and deploys it to GitHub Pages.
name: docs

on:
  push:
    branches: [main]
    paths: ["packages/docs/**", "packages/dev.ts", "examples/**", "package.json", "pnpm-lock.yaml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # makes tcm's codebase from packages/ (the first `pnpm tcm`), then builds the site from it; fails on any
      # broken link or anchor
      - run: pnpm docs:site "$PWD/dist/site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
